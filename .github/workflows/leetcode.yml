name: LeetCode activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,14 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/leetcode_card.py'
      - '.github/workflows/leetcode.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: generated-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check activity calculations
        run: python3 -m unittest discover -s tests -v
      - name: Read the public LeetCode account
        run: python3 scripts/leetcode_card.py --fetch
      - name: Validate generated cards
        run: python3 scripts/leetcode_card.py --check
      - name: Commit the refreshed snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/leetcode.json assets/leetcode.svg assets/leetcode-mobile.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/leetcode.json assets/leetcode.svg assets/leetcode-mobile.svg
          git commit -m 'data: refresh public LeetCode activity'
          git push origin HEAD:main
